# Report include directives with nested chunk="to-content" attributes.
#
# AsciiDoc assemblies and maps use the chunk="to-content" attribute to make
# the topic and any topics nested under it part of a single page. Do not
# add chunk="to-content" to any topics that are nested under a topic that
# already has this attribute assigned.
---
extends: script
message: "The chunk=\"to-content\" attribute cannot be nested."
level: warning
link: https://github.com/jhradilek/asciidoctor-dita-vale/blob/main/README.md#warnings
scope: raw
script: |
  text               := import("text")
  matches            := []

  r_chunk_attribute  := text.re_compile("^(?:.*, *|)chunk=\"to-content\"(?:,.*|)$")
  r_chunk_definition := text.re_compile("^:chunk-to-content:(?:|[ \\t].*)$")
  r_comment_block    := text.re_compile("^/{4,}\\s*$")
  r_comment_line     := text.re_compile("^(//|//[^/].*)$")
  r_content_type     := text.re_compile("^:_(?:mod-docs-content|content|module)-type:[ \\t]+((?i)map|assembly)[ \\t]*$")
  r_include          := text.re_compile("^include::(?:[^ \\t\\[]|[^[]*[^ \\t\\[])\\[(.*)\\][ \\t]*$")
  r_leveloffset      := text.re_compile("^(?:.*, *|)leveloffset=([+-]?[0-9]+)(?:,.*|)$")

  document           := text.split(text.trim_suffix(scope, "\n"), "\n")

  in_comment_block   := false
  is_asciidoc_map    := false
  is_first_include   := true
  is_chunked         := false
  chunk_offset       := undefined
  content_type       := ""
  stack              := []

  start              := 0
  end                := 0

  for line in document {
    start += end
    end    = len(line) + 1

    if r_comment_block.match(line) {
      delimiter := text.trim_space(line)
      if ! in_comment_block {
        in_comment_block = delimiter
      } else if in_comment_block == delimiter {
        in_comment_block = false
      }
      continue
    }
    if in_comment_block { continue }
    if r_comment_line.match(line) { continue }

    if r_content_type.match(line) {
      is_asciidoc_map = true
      content_type    = text.to_lower(r_content_type.replace(line, "$1"))
      continue
    }

    if r_chunk_definition.match(line) {
      is_chunked = true
      continue
    }

    if ! r_include.match(line) { continue }

    attribute_list  := r_include.replace(line, "$1")
    level_offset    := r_leveloffset.replace(attribute_list, "$1")
    current_offset  := int(level_offset) || 0
    previous_offset := stack[len(stack) - 1]

    if r_chunk_attribute.match(attribute_list) &&
       is_chunked && content_type == "assembly" {
      matches = append(matches, {begin: start, end: start + end - 1})
      continue
    }

    if is_int(chunk_offset) {
      if r_chunk_attribute.match(attribute_list) &&
         current_offset - chunk_offset == 1 {
        matches = append(matches, {begin: start, end: start + end - 1})
      } else if current_offset <= chunk_offset {
        chunk_offset = undefined
      }
    } else if r_chunk_attribute.match(attribute_list) {
      chunk_offset = current_offset
    }

    if is_first_include {
      stack = append(stack, current_offset)
      is_first_include = false
      continue
    }

    if current_offset > previous_offset {
      stack = append(stack, current_offset)
      continue
    }

    for len(stack) > 1 && current_offset < previous_offset  {
      splice(stack, len(stack) - 1, 1)
      previous_offset = stack[len(stack) - 1]
    }

    if current_offset > previous_offset {
      stack = append(stack, current_offset)
      continue
    }
  }

  if ! is_asciidoc_map {
    matches = []
  }
