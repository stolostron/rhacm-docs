# Report conditional directives.
#
# Lists all ifdef, ifndef, and ifeval conditional statements in the file. Use
# this information to decide which attribute definitions to supply during
# conversion.
---
extends: script
message: "%s"
level: suggestion
link: https://github.com/jhradilek/asciidoctor-dita-vale/blob/main/README.md#suggestions
scope: raw
script: |
  text              := import("text")
  matches           := []

  r_comment_block   := text.re_compile("^/{4,}\\s*$")
  r_conditional     := text.re_compile("^if(?:n?def|eval)::\\S*\\[.*\\][ \\t]*$")
  r_context         := text.re_compile("^if(?:n?def|eval)::context\\[:[0-9A-Za-z_][0-9A-Za-z_-]*:[ \\t]+\\{context\\}\\][ \\t]*$")
  r_ignore_type     := text.re_compile("^:_(?:mod-docs-content|content|module)-type:[ \\t]+(?i:ignore)[ \\t]*$")
  r_parent_context  := text.re_compile("^if(?:n?def|eval)::[0-9A-Za-z_][0-9A-Za-z_-]*\\[(?::!context:|:context:[ \\t]+\\{[0-9A-Za-z_][0-9A-Za-z_-]*\\})\\][ \\t]*$")

  document          := text.split(text.trim_suffix(scope, "\n"), "\n")

  in_comment_block  := false
  start             := 0
  end               := 0

  for line in document {
    start += end
    end    = len(line) + 1

    if r_comment_block.match(line) {
      delimiter := text.trim_space(line)
      if ! in_comment_block {
        in_comment_block = delimiter
      } else if in_comment_block == delimiter {
        in_comment_block = false
      }
      continue
    }
    if in_comment_block { continue }

    if r_ignore_type.match(line) {
      matches = []
      break
    }

    if r_context.match(line) || r_parent_context.match(line) { continue }

    if r_conditional.match(line) {
      matches = append(matches, {begin: start, end: start + end - 1})
    }
  }
