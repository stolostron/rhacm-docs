# Report invalid attribute definitions in maps.
#
# AsciiDoc assemblies support the :chunk-to-content: and :navtitle:
# attributes as a way to assign the chunk="to-content" and navtitle
# attributes to the DITA concept they convert to. Do not use
# :chunk-to-content: or :navtitle: attribute definitions in AsciiDoc maps.
---
extends: script
message: "The selected attribute definition is not supported in maps."
level: warning
link: https://github.com/jhradilek/asciidoctor-dita-vale/blob/main/README.md#warnings
scope: raw
script: |
  text              := import("text")
  matches           := []

  r_chunk_attr      := text.re_compile("^:chunk-to-content:(?:|[ \\t].*)$")
  r_comment_block   := text.re_compile("^/{4,}\\s*$")
  r_comment_line    := text.re_compile("^(//|//[^/].*)$")
  r_content_type    := text.re_compile("^:_(?:mod-docs-content|content|module)-type:[ \\t]+(?i:map)[ \\t]*$")
  r_navtitle_attr   := text.re_compile("^:navtitle:(?:|[ \\t].*)$")

  document          := text.split(text.trim_suffix(scope, "\n"), "\n")

  in_comment_block  := false
  is_asciidoc_map   := false
  start             := 0
  end               := 0

  for line in document {
    start += end
    end    = len(line) + 1

    if r_comment_block.match(line) {
      delimiter := text.trim_space(line)
      if ! in_comment_block {
        in_comment_block = delimiter
      } else if in_comment_block == delimiter {
        in_comment_block = false
      }
      continue
    }
    if in_comment_block { continue }
    if r_comment_line.match(line) { continue }

    if r_content_type.match(line) {
      is_asciidoc_map = true
      continue
    }

    if r_chunk_attr.match(line) || r_navtitle_attr.match(line) {
      matches = append(matches, {begin: start, end: start + end - 1})
    }
  }

  if ! is_asciidoc_map {
    matches = []
  }
