name: Linting

on:
  pull_request:

jobs:
  asciidoc:
    name: Build AsciiDocs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install asciidoctor
        run: |
          sudo apt-get install -y asciidoctor

      - name: Build each .adoc with Asciidoctor, fail on WARN or above
        run: |
          ./.github/workflows/build_doc.sh

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link Check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --cache
            --verbose
            --max-cache-age 3d
            --no-progress
            --max-concurrency 30
            --timeout 30
            --retry-wait-time 30
            --scheme http
            --scheme https
            --require-https
            --accept 200..=299,403,429,302,500
            --exclude https://github.com/stolostron/backlog/.*
            ./**/main.html
          fail: true
